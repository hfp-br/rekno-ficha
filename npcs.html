<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Magie — NPCs</title>

<style>
:root{
  --sand-0:#f6edd7;
  --sand-1:#ead8ad;
  --sand-2:#cfb47b;
  --sand-3:#a9824d;
  --sand-4:#705233;
  --sand-5:#3d2b1d;

  --ink:#322619;
  --muted:#7d684d;
  --line:rgba(104,75,43,.30);

  --panel:rgba(255,250,237,.82);
  --panel-strong:rgba(255,248,228,.95);

  --danger:#8f493d;
  --success:#546547;
  --shadow:0 14px 40px rgba(50,32,14,.18);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at 15% 18%, rgba(255,255,255,.20), transparent 28%),
    radial-gradient(circle at 82% 70%, rgba(90,60,30,.09), transparent 32%),
    linear-gradient(155deg,#dcc28d,#b8955f);
}

button,input,select{font:inherit}

button{
  border:1px solid var(--line);
  color:var(--ink);
  background:var(--panel-strong);
  border-radius:9px;
  padding:9px 12px;
  cursor:pointer;
  transition:.14s ease;
}

button:hover{
  transform:translateY(-1px);
  border-color:rgba(112,82,51,.55);
}

button.primary{
  background:var(--sand-4);
  color:var(--sand-0);
  border-color:var(--sand-5);
}

button.danger{
  color:#fff8e8;
  background:var(--danger);
  border-color:#71372f;
}

button.ghost{
  background:transparent;
}

button.icon{
  width:32px;
  height:32px;
  padding:0;
  display:grid;
  place-items:center;
}

input,select{
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.52);
  color:var(--ink);
  padding:9px 10px;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--sand-4);
  box-shadow:0 0 0 3px rgba(112,82,51,.08);
}

.app{
  width:min(1440px,calc(100% - 28px));
  min-height:calc(100vh - 28px);
  margin:14px auto;
  background:
    linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.05)),
    repeating-linear-gradient(
      7deg,
      rgba(98,65,32,.018) 0px,
      rgba(98,65,32,.018) 1px,
      transparent 1px,
      transparent 5px
    ),
    var(--sand-0);
  border:1px solid rgba(79,52,28,.42);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.topbar{
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  background:rgba(255,248,228,.64);
}

.brand h1{
  margin:0;
  font-size:28px;
  line-height:1;
}

.brand small{
  display:block;
  margin-top:6px;
  color:var(--muted);
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.layout{
  display:grid;
  grid-template-columns:270px 1fr;
  min-height:calc(100vh - 107px);
}

.sidebar{
  border-right:1px solid var(--line);
  padding:16px 12px;
  background:rgba(234,216,173,.22);
}

.sidebar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:2px 4px 12px;
}

.sidebar-head strong{
  text-transform:uppercase;
  letter-spacing:.07em;
  font-size:13px;
}

.folder-list{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.folder-row{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:6px;
  border-radius:9px;
}

.folder-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  width:100%;
  padding:9px 10px;
  border:none;
  background:transparent;
  text-align:left;
  border-radius:9px;
}

.folder-row.active .folder-main{
  background:rgba(112,82,51,.13);
  font-weight:bold;
}

.folder-main:hover{
  transform:none;
  background:rgba(112,82,51,.09);
}

.folder-count{
  min-width:25px;
  padding:2px 7px;
  border-radius:99px;
  background:rgba(112,82,51,.10);
  color:var(--muted);
  font-size:11px;
  text-align:center;
}

.folder-tools{
  display:flex;
  gap:3px;
}

.folder-tools button{
  border:none;
  background:transparent;
  padding:4px;
  opacity:.55;
}

.folder-tools button:hover{
  opacity:1;
  transform:none;
}

.sidebar-footer{
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}

.content{
  min-width:0;
  padding:20px;
}

.toolbar{
  display:grid;
  grid-template-columns:minmax(220px,1fr) 190px auto;
  gap:10px;
  align-items:center;
  margin-bottom:18px;
}

.current-folder{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:14px;
  margin-bottom:14px;
}

.current-folder h2{
  margin:0;
  font-size:24px;
}

.current-folder small{
  color:var(--muted);
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:14px;
}

.npc-card{
  position:relative;
  min-height:300px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--panel);
  box-shadow:0 7px 18px rgba(60,40,20,.08);
}

.npc-portrait{
  position:relative;
  height:150px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%,rgba(255,255,255,.45),transparent 28%),
    linear-gradient(145deg,var(--sand-1),var(--sand-3));
  display:grid;
  place-items:center;
}

.npc-portrait img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.npc-initials{
  font-size:44px;
  font-weight:bold;
  color:rgba(61,43,29,.55);
  user-select:none;
}

.npc-body{
  flex:1;
  padding:13px 14px 10px;
}

.npc-body h3{
  margin:0 0 6px;
  font-size:20px;
}

.npc-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  color:var(--muted);
  font-size:12px;
}

.pill{
  padding:4px 7px;
  border-radius:99px;
  background:rgba(112,82,51,.09);
  border:1px solid rgba(112,82,51,.11);
}

.npc-updated{
  margin-top:11px;
  color:var(--muted);
  font-size:11px;
}

.card-actions{
  display:grid;
  grid-template-columns:1fr auto auto auto;
  gap:6px;
  padding:0 12px 12px;
}

.empty{
  grid-column:1/-1;
  display:grid;
  place-items:center;
  text-align:center;
  min-height:330px;
  border:1px dashed rgba(112,82,51,.35);
  border-radius:13px;
  color:var(--muted);
  background:rgba(255,255,255,.18);
}

.empty strong{
  color:var(--ink);
  display:block;
  margin-bottom:5px;
}

dialog{
  width:min(520px,calc(100% - 24px));
  border:1px solid rgba(79,52,28,.42);
  border-radius:14px;
  color:var(--ink);
  background:var(--sand-0);
  box-shadow:0 25px 70px rgba(40,25,10,.38);
  padding:0;
}

dialog::backdrop{
  background:rgba(35,24,14,.42);
  backdrop-filter:blur(2px);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  padding:14px 16px;
  border-bottom:1px solid var(--line);
}

.modal-head h3{margin:0}

.modal-body{
  padding:16px;
  display:grid;
  gap:12px;
}

.field{
  display:grid;
  gap:5px;
}

.field label{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.07em;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:0 16px 16px;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  max-width:min(420px,calc(100vw - 36px));
  padding:11px 14px;
  border-radius:10px;
  color:#fff8e8;
  background:#3d2b1d;
  box-shadow:0 8px 28px rgba(30,20,10,.3);
  opacity:0;
  transform:translateY(12px);
  pointer-events:none;
  transition:.2s ease;
  z-index:9999;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

.hidden{display:none!important}

@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  .sidebar{
    border-right:0;
    border-bottom:1px solid var(--line);
  }
  .folder-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  }
  .toolbar{
    grid-template-columns:1fr 150px;
  }
  .toolbar button{
    grid-column:1/-1;
  }
}

@media(max-width:560px){
  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }
  .top-actions{
    width:100%;
  }
  .top-actions button{
    flex:1;
  }
  .toolbar{grid-template-columns:1fr}
  .current-folder{
    align-items:flex-start;
    flex-direction:column;
  }
  .card-actions{
    grid-template-columns:1fr 1fr 1fr;
  }
  .card-actions .open-btn{
    grid-column:1/-1;
  }
}
</style>
</head>

<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <h1>La Magie — NPCs</h1>
      <small>Biblioteca local do mestre • IndexedDB</small>
    </div>

    <div class="top-actions">
      <button id="exportAllBtn">Exportar tudo</button>
      <button id="importBtn">Importar backup</button>
      <button id="newNpcBtn" class="primary">+ Novo NPC</button>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-head">

        <button id="newFolderBtn" class="icon" title="Nova pasta">+</button>
      </div>

      <div id="folderList" class="folder-list"></div>

      </div>

    <main class="content">

        <button id="exportFolderBtn">Exportar pasta</button>

          <h2 id="currentFolderTitle">Todos os NPCs</h2>

</div>


<!-- NOVA / RENOMEAR PASTA -->
<dialog id="folderDialog">
  <form id="folderForm" method="dialog">
    <div class="modal-head">
      <h3 id="folderDialogTitle">Nova pasta</h3>
      <button type="button" class="icon" data-close-dialog="folderDialog">×</button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label for="folderNameInput">Nome</label>

      </div>
    </div>

    <div class="modal-actions">
      <button type="button" data-close-dialog="folderDialog">Cancelar</button>
      <button class="primary" value="default">Salvar</button>
    </div>
  </form>
</dialog>


<!-- NOVO NPC -->
<dialog id="npcDialog">
  <form id="npcForm" method="dialog">
    <div class="modal-head">
      <h3>Novo NPC</h3>
      <button type="button" class="icon" data-close-dialog="npcDialog">×</button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label for="npcNameInput">Nome</label>
        <input id="npcNameInput" maxlength="120" required autocomplete="off">
      </div>

      <div class="field">

        <input id="npcLevelInput" type="number" min="1" max="20" value="1">

        <input

        >
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" data-close-dialog="npcDialog">Cancelar</button>
      <button class="primary" value="default">Criar NPC</button>
    </div>
  </form>
</dialog>


<!-- MOVER NPC -->
<dialog id="moveDialog">
  <form id="moveForm" method="dialog">
    <div class="modal-head">
      <h3>Mover NPC</h3>
      <button type="button" class="icon" data-close-dialog="moveDialog">×</button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label for="moveFolderSelect">Mover para</label>
        <select id="moveFolderSelect"></select>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" data-close-dialog="moveDialog">Cancelar</button>
      <button class="primary" value="default">Mover</button>
    </div>
  </form>
</dialog>


<input id="importFileInput" type="file" accept="application/json,.json" class="hidden">
<div id="toast" class="toast"></div>


<script>
/* ============================================================
   INDEXEDDB
   ============================================================ */

const DB_NAME = "la-magie-npcs";
const DB_VERSION = 1;

const STORE_FOLDERS = "pastas";
const STORE_NPCS = "npcs";

let db = null;

function abrirBanco() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = event => {
      const database = event.target.result;

      if (!database.objectStoreNames.contains(STORE_FOLDERS)) {
        const folders = database.createObjectStore(
          STORE_FOLDERS,
          { keyPath: "id" }
        );

        folders.createIndex(
          "nome",
          "nome",
          { unique: false }
        );
      }

      if (!database.objectStoreNames.contains(STORE_NPCS)) {
        const npcs = database.createObjectStore(
          STORE_NPCS,
          { keyPath: "id" }
        );

        npcs.createIndex(
          "pastaId",
          "pastaId",
          { unique: false }
        );

        npcs.createIndex(
          "nome",
          "nome",
          { unique: false }
        );

        npcs.createIndex(
          "atualizadoEm",
          "atualizadoEm",
          { unique: false }
        );
      }
    };

    request.onsuccess = () => {
      db = request.result;
      resolve(db);
    };

    request.onerror = () => {
      reject(request.error);
    };
  });
}

function store(name, mode = "readonly") {
  return db
    .transaction(name, mode)
    .objectStore(name);
}

function requestPromise(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function dbGetAll(storeName) {
  return requestPromise(
    store(storeName).getAll()
  );
}

async function dbPut(storeName, value) {
  return requestPromise(
    store(storeName, "readwrite").put(value)
  );
}

async function dbDelete(storeName, id) {
  return requestPromise(
    store(storeName, "readwrite").delete(id)
  );
}

async function dbClear(storeName) {
  return requestPromise(
    store(storeName, "readwrite").clear()
  );
}


/* ============================================================
   TEMPLATE LIMPO DO NPC
   ============================================================ */

function criarTemplateNpc(nome, nivel, pastaId, retrato) {
  const agora = new Date().toISOString();

  return {
    id: crypto.randomUUID(),

    pastaId: pastaId || null,
    nome: nome.trim(),
    retrato: retrato?.trim() || "",

    criadoEm: agora,
    atualizadoEm: agora,

    ficha: {
      nivel: Math.max(1, Number(nivel) || 1),
      xp: 0,

      forca: 10,
      destreza: 10,
      constituicao: 10,
      inteligencia: 10,
      sabedoria: 10,
      carisma: 10,

      vida_atual: 4,
      vida_temp: 0,

      pv_base_nivel_1: 4,
      pv_por_nivel: 4,

      modo_ca: "natural",
      ca_manual: 10,

      proficiencias: [],

      notas: "",
      notas_combate: "",

      conteudo_dinamico: {
        inventario: [],
        ataques: [],
        magias: [],
        talentos: [],
        classe: [],
        antecedente: [],
        raca: [],

        recursos: [],
        lembretesCombate: [],
        acoesCombate: [],
        togglesCombate: [],

        spellcasting: {
          enabled: false,
          usesSlots: false,
          slotsByLevel: {},
          currentSlots: [0,0,0,0,0,0,0,0,0]
        },

        theme: {
          baseColor: "#b8955f"
        },

        movement: {
          base: 9
        },

        armor: {
          modes: [
            {
              id: "natural",
              name: "Padrão (10 + DES)",
              base: 10,
              attributes: ["dex"],
              attributeCaps: {},
              flatBonus: 0,
              manual: false
            },
            {
              id: "manual",
              name: "Manual",
              base: 0,
              attributes: [],
              attributeCaps: {},
              flatBonus: 0,
              manual: true
            }
          ]
        }
      }
    }
  };
}


/* ============================================================
   ESTADO
   ============================================================ */

let pastas = [];
let npcs = [];

let pastaSelecionada = "all";
let folderBeingEditedId = null;
let npcBeingMovedId = null;


/* ============================================================
   ELEMENTOS
   ============================================================ */

const folderList = document.getElementById("folderList");
const npcCards = document.getElementById("npcCards");

const searchInput = document.getElementById("searchInput");
const sortSelect = document.getElementById("sortSelect");

const currentFolderTitle = document.getElementById("currentFolderTitle");
const currentFolderSubtitle = document.getElementById("currentFolderSubtitle");

const folderDialog = document.getElementById("folderDialog");
const folderForm = document.getElementById("folderForm");
const folderNameInput = document.getElementById("folderNameInput");
const folderDialogTitle = document.getElementById("folderDialogTitle");

const npcDialog = document.getElementById("npcDialog");
const npcForm = document.getElementById("npcForm");
const npcNameInput = document.getElementById("npcNameInput");
const npcLevelInput = document.getElementById("npcLevelInput");
const npcFolderSelect = document.getElementById("npcFolderSelect");
const npcPortraitInput = document.getElementById("npcPortraitInput");

const moveDialog = document.getElementById("moveDialog");
const moveForm = document.getElementById("moveForm");
const moveFolderSelect = document.getElementById("moveFolderSelect");

const importFileInput = document.getElementById("importFileInput");


/* ============================================================
   HELPERS
   ============================================================ */

function escaparHtml(valor = "") {
  return String(valor)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function nomePasta(pastaId) {
  if (!pastaId) {
    return "Sem pasta";
  }

  return (
    pastas.find(p => p.id === pastaId)?.nome
    || "Pasta removida"
  );
}

function iniciais(nome) {
  return String(nome)
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map(p => p[0]?.toUpperCase() || "")
    .join("") || "?";
}

function formatarData(iso) {
  if (!iso) {
    return "—";
  }

  const data = new Date(iso);

  return new Intl.DateTimeFormat(
    "pt-BR",
    {
      dateStyle: "short",
      timeStyle: "short"
    }
  ).format(data);
}

let toastTimer = null;

function toast(mensagem) {
  const el = document.getElementById("toast");

  el.textContent = mensagem;
  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    el.classList.remove("show");
  }, 2400);
}

function baixarJson(nomeArquivo, dados) {
  const blob = new Blob(
    [JSON.stringify(dados, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = nomeArquivo;

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}


/* ============================================================
   CARREGAMENTO
   ============================================================ */

async function recarregarDados() {
  [pastas, npcs] = await Promise.all([
    dbGetAll(STORE_FOLDERS),
    dbGetAll(STORE_NPCS)
  ]);

  pastas.sort((a, b) =>
    a.nome.localeCompare(
      b.nome,
      "pt-BR",
      { sensitivity: "base" }
    )
  );

  renderTudo();
}


/* ============================================================
   RENDER DE PASTAS
   ============================================================ */

function contarNpcDaPasta(pastaId) {
  if (pastaId === "all") {
    return npcs.length;
  }

  if (pastaId === "none") {
    return npcs.filter(npc => !npc.pastaId).length;
  }

  return npcs.filter(
    npc => npc.pastaId === pastaId
  ).length;
}

function criarFolderRow(id, nome, editavel = false) {
  const row = document.createElement("div");

  row.className =
    "folder-row" +
    (pastaSelecionada === id ? " active" : "");

  const main = document.createElement("button");
  main.className = "folder-main";

  main.innerHTML = `
    <span>${escaparHtml(nome)}</span>
    <span class="folder-count">
      ${contarNpcDaPasta(id)}
    </span>
  `;

  main.addEventListener("click", () => {
    pastaSelecionada = id;
    renderTudo();
  });

  row.appendChild(main);

  if (editavel) {
    const tools = document.createElement("div");
    tools.className = "folder-tools";

    const rename = document.createElement("button");
    rename.title = "Renomear";
    rename.textContent = "✎";

    rename.addEventListener("click", event => {
      event.stopPropagation();
      abrirRenomearPasta(id);
    });

    const del = document.createElement("button");
    del.title = "Excluir";
    del.textContent = "×";

    del.addEventListener("click", event => {
      event.stopPropagation();
      excluirPasta(id);
    });

    tools.append(rename, del);
    row.appendChild(tools);
  }

  return row;
}

function renderPastas() {
  folderList.innerHTML = "";

  folderList.appendChild(
    criarFolderRow(
      "all",
      "Todos os NPCs"
    )
  );

  folderList.appendChild(
    criarFolderRow(
      "none",
      "Sem pasta"
    )
  );

  pastas.forEach(pasta => {
    folderList.appendChild(
      criarFolderRow(
        pasta.id,
        pasta.nome,
        true
      )
    );
  });
}


/* ============================================================
   FILTRO / ORDENAÇÃO
   ============================================================ */

function npcsVisiveis() {
  let lista = [...npcs];

  if (pastaSelecionada === "none") {
    lista = lista.filter(npc => !npc.pastaId);
  }
  else if (pastaSelecionada !== "all") {
    lista = lista.filter(
      npc => npc.pastaId === pastaSelecionada
    );
  }

  const termo =
    searchInput.value
      .trim()
      .toLocaleLowerCase("pt-BR");

  if (termo) {
    lista = lista.filter(npc =>
      npc.nome
        .toLocaleLowerCase("pt-BR")
        .includes(termo)
    );
  }

  switch (sortSelect.value) {
    case "updated-asc":
      lista.sort((a,b) =>
        new Date(a.atualizadoEm) -
        new Date(b.atualizadoEm)
      );
      break;

    case "name-asc":
      lista.sort((a,b) =>
        a.nome.localeCompare(
          b.nome,
          "pt-BR",
          { sensitivity:"base" }
        )
      );
      break;

    case "name-desc":
      lista.sort((a,b) =>
        b.nome.localeCompare(
          a.nome,
          "pt-BR",
          { sensitivity:"base" }
        )
      );
      break;

    case "updated-desc":
    default:
      lista.sort((a,b) =>
        new Date(b.atualizadoEm) -
        new Date(a.atualizadoEm)
      );
  }

  return lista;
}


/* ============================================================
   RENDER DE NPCS
   ============================================================ */

function renderNpcCards() {
  const lista = npcsVisiveis();

  npcCards.innerHTML = "";

  let titulo = "Todos os NPCs";

  if (pastaSelecionada === "none") {
    titulo = "Sem pasta";
  }
  else if (pastaSelecionada !== "all") {
    titulo =
      pastas.find(
        p => p.id === pastaSelecionada
      )?.nome || "Pasta";
  }

  currentFolderTitle.textContent = titulo;

  currentFolderSubtitle.textContent =
    `${lista.length} ${lista.length === 1 ? "NPC" : "NPCs"}`;

  if (lista.length === 0) {
    npcCards.innerHTML = `
      <div class="empty">
        <div>
          <strong>Nenhum NPC aqui ainda.</strong>
          Crie um novo NPC ou altere a busca.
        </div>
      </div>
    `;
    return;
  }

  lista.forEach(npc => {
    const card = document.createElement("article");
    card.className = "npc-card";

    const level =
      Number(npc.ficha?.nivel ?? 1);

    const retrato = npc.retrato?.trim();

    card.innerHTML = `
      <div class="npc-portrait">
        ${
          retrato
            ? `<img
                src="${escaparHtml(retrato)}"
                alt="${escaparHtml(npc.nome)}"
                onerror="this.remove(); this.parentElement.insertAdjacentHTML('beforeend','<div class=&quot;npc-initials&quot;>${escaparHtml(iniciais(npc.nome))}</div>')"
              >`
            : `<div class="npc-initials">${escaparHtml(iniciais(npc.nome))}</div>`
        }
      </div>

      <div class="npc-body">
        <h3>${escaparHtml(npc.nome)}</h3>

        <div class="npc-meta">
          <span class="pill">Nível ${level}</span>
          <span class="pill">${escaparHtml(nomePasta(npc.pastaId))}</span>
        </div>

        <div class="npc-updated">
          Editado em ${escaparHtml(formatarData(npc.atualizadoEm))}
        </div>
      </div>

      <div class="card-actions">
        <button
          class="primary open-btn"
          data-action="open"
          data-id="${npc.id}"
        >
          Abrir
        </button>

        <button
          title="Duplicar"
          data-action="duplicate"
          data-id="${npc.id}"
        >
          ⧉
        </button>

        <button
          title="Mover"
          data-action="move"
          data-id="${npc.id}"
        >
          ↪
        </button>

        <button
          title="Excluir"
          data-action="delete"
          data-id="${npc.id}"
        >
          ×
        </button>
      </div>
    `;

    npcCards.appendChild(card);
  });
}

function renderTudo() {
  renderPastas();
  renderNpcCards();
  preencherSelectPastas();
}


/* ============================================================
   PASTAS
   ============================================================ */

function abrirNovaPasta() {
  folderBeingEditedId = null;
  folderDialogTitle.textContent = "Nova pasta";
  folderNameInput.value = "";
  folderDialog.showModal();

  setTimeout(() => folderNameInput.focus(), 0);
}

function abrirRenomearPasta(id) {
  const pasta = pastas.find(p => p.id === id);

  if (!pasta) {
    return;
  }

  folderBeingEditedId = id;
  folderDialogTitle.textContent = "Renomear pasta";
  folderNameInput.value = pasta.nome;
  folderDialog.showModal();

  setTimeout(() => {
    folderNameInput.focus();
    folderNameInput.select();
  }, 0);
}

folderForm.addEventListener("submit", async event => {
  event.preventDefault();

  const nome = folderNameInput.value.trim();

  if (!nome) {
    return;
  }

  if (folderBeingEditedId) {
    const pasta =
      pastas.find(
        p => p.id === folderBeingEditedId
      );

    if (!pasta) {
      return;
    }

    pasta.nome = nome;
    pasta.atualizadoEm = new Date().toISOString();

    await dbPut(STORE_FOLDERS, pasta);

    toast("Pasta renomeada.");
  }
  else {
    const agora = new Date().toISOString();

    await dbPut(
      STORE_FOLDERS,
      {
        id: crypto.randomUUID(),
        nome,
        criadoEm: agora,
        atualizadoEm: agora
      }
    );

    toast("Pasta criada.");
  }

  folderDialog.close();
  await recarregarDados();
});

async function excluirPasta(id) {
  const pasta = pastas.find(p => p.id === id);

  if (!pasta) {
    return;
  }

  const quantidade =
    npcs.filter(
      npc => npc.pastaId === id
    ).length;

  const ok = confirm(
    quantidade > 0
      ? `Excluir a pasta "${pasta.nome}"?\n\nOs ${quantidade} NPC(s) dela serão movidos para "Sem pasta".`
      : `Excluir a pasta "${pasta.nome}"?`
  );

  if (!ok) {
    return;
  }

  const afetados =
    npcs.filter(
      npc => npc.pastaId === id
    );

  for (const npc of afetados) {
    npc.pastaId = null;
    npc.atualizadoEm = new Date().toISOString();

    await dbPut(STORE_NPCS, npc);
  }

  await dbDelete(STORE_FOLDERS, id);

  if (pastaSelecionada === id) {
    pastaSelecionada = "none";
  }

  toast("Pasta excluída.");
  await recarregarDados();
}


/* ============================================================
   NPCS
   ============================================================ */

function preencherSelectPastas() {
  const options = [
    `<option value="">Sem pasta</option>`,
    ...pastas.map(pasta =>
      `<option value="${pasta.id}">${escaparHtml(pasta.nome)}</option>`
    )
  ].join("");

  npcFolderSelect.innerHTML = options;
  moveFolderSelect.innerHTML = options;
}

function abrirNovoNpc() {
  npcNameInput.value = "";
  npcLevelInput.value = 1;
  npcPortraitInput.value = "";

  if (
    pastaSelecionada !== "all" &&
    pastaSelecionada !== "none"
  ) {
    npcFolderSelect.value = pastaSelecionada;
  }
  else {
    npcFolderSelect.value = "";
  }

  npcDialog.showModal();

  setTimeout(() => npcNameInput.focus(), 0);
}

npcForm.addEventListener("submit", async event => {
  event.preventDefault();

  const nome = npcNameInput.value.trim();

  if (!nome) {
    return;
  }

  const npc = criarTemplateNpc(
    nome,
    npcLevelInput.value,
    npcFolderSelect.value || null,
    npcPortraitInput.value
  );

  await dbPut(STORE_NPCS, npc);

  npcDialog.close();

  toast("NPC criado.");

  await recarregarDados();

  // O npc.html será criado no próximo passo.
  // Quando existir, esta linha já abre a ficha correta.
  window.location.href =
    `npc.html?id=${encodeURIComponent(npc.id)}`;
});

async function duplicarNpc(id) {
  const original =
    npcs.find(npc => npc.id === id);

  if (!original) {
    return;
  }

  const agora = new Date().toISOString();

  const copia =
    structuredClone(original);

  copia.id = crypto.randomUUID();
  copia.nome = `${original.nome} — Cópia`;
  copia.criadoEm = agora;
  copia.atualizadoEm = agora;

  await dbPut(STORE_NPCS, copia);

  toast("NPC duplicado.");
  await recarregarDados();
}

function abrirMoverNpc(id) {
  const npc = npcs.find(n => n.id === id);

  if (!npc) {
    return;
  }

  npcBeingMovedId = id;
  moveFolderSelect.value =
    npc.pastaId || "";

  moveDialog.showModal();
}

moveForm.addEventListener("submit", async event => {
  event.preventDefault();

  const npc =
    npcs.find(
      n => n.id === npcBeingMovedId
    );

  if (!npc) {
    return;
  }

  npc.pastaId =
    moveFolderSelect.value || null;

  npc.atualizadoEm =
    new Date().toISOString();

  await dbPut(STORE_NPCS, npc);

  moveDialog.close();

  toast("NPC movido.");
  await recarregarDados();
});

async function excluirNpc(id) {
  const npc =
    npcs.find(n => n.id === id);

  if (!npc) {
    return;
  }

  const ok =
    confirm(
      `Excluir "${npc.nome}"?\n\nEssa ação não pode ser desfeita sem um backup.`
    );

  if (!ok) {
    return;
  }

  await dbDelete(STORE_NPCS, id);

  toast("NPC excluído.");
  await recarregarDados();
}

npcCards.addEventListener("click", event => {
  const button =
    event.target.closest(
      "button[data-action]"
    );

  if (!button) {
    return;
  }

  const id = button.dataset.id;

  switch (button.dataset.action) {
    case "open":
      window.location.href =
        `npc.html?id=${encodeURIComponent(id)}`;
      break;

    case "duplicate":
      duplicarNpc(id);
      break;

    case "move":
      abrirMoverNpc(id);
      break;

    case "delete":
      excluirNpc(id);
      break;
  }
});


/* ============================================================
   BACKUP
   ============================================================ */

document
  .getElementById("exportAllBtn")
  .addEventListener("click", () => {

    baixarJson(
      "la-magie-npcs-backup.json",
      {
        formato: "la-magie-npcs",
        versao: 1,
        exportadoEm:
          new Date().toISOString(),
        pastas,
        npcs
      }
    );

    toast("Backup exportado.");
  });


document
  .getElementById("exportFolderBtn")
  .addEventListener("click", () => {

    if (
      pastaSelecionada === "all"
    ) {
      toast(
        "Selecione uma pasta específica para exportá-la."
      );

      return;
    }

    let pasta = null;
    let npcsDaPasta = [];

    if (
      pastaSelecionada === "none"
    ) {
      pasta = {
        id: null,
        nome: "Sem pasta"
      };

      npcsDaPasta =
        npcs.filter(
          npc => !npc.pastaId
        );
    }
    else {
      pasta =
        pastas.find(
          p => p.id === pastaSelecionada
        );

      if (!pasta) {
        return;
      }

      npcsDaPasta =
        npcs.filter(
          npc =>
            npc.pastaId === pasta.id
        );
    }

    const nomeSeguro =
      pasta.nome
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\w-]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .toLowerCase() || "pasta";

    baixarJson(
      `${nomeSeguro}.json`,
      {
        formato: "la-magie-npcs-folder",
        versao: 1,
        exportadoEm:
          new Date().toISOString(),
        pastas:
          pasta.id ? [pasta] : [],
        npcs: npcsDaPasta
      }
    );

    toast("Pasta exportada.");
  });


document
  .getElementById("importBtn")
  .addEventListener("click", () => {
    importFileInput.value = "";
    importFileInput.click();
  });


importFileInput.addEventListener(
  "change",
  async () => {

    const file =
      importFileInput.files?.[0];

    if (!file) {
      return;
    }

    try {
      const json =
        JSON.parse(await file.text());

      if (
        !Array.isArray(json.pastas) ||
        !Array.isArray(json.npcs)
      ) {
        throw new Error(
          "Arquivo não possui pastas e npcs válidos."
        );
      }

      const ok = confirm(
        `Importar ${json.npcs.length} NPC(s) e ${json.pastas.length} pasta(s)?\n\nItens com o mesmo ID serão atualizados. Os demais dados atuais serão mantidos.`
      );

      if (!ok) {
        return;
      }

      for (const pasta of json.pastas) {
        if (
          pasta &&
          typeof pasta.id === "string" &&
          typeof pasta.nome === "string"
        ) {
          await dbPut(
            STORE_FOLDERS,
            pasta
          );
        }
      }

      for (const npc of json.npcs) {
        if (
          npc &&
          typeof npc.id === "string" &&
          typeof npc.nome === "string"
        ) {
          await dbPut(
            STORE_NPCS,
            npc
          );
        }
      }

      toast("Backup importado.");
      await recarregarDados();
    }
    catch (error) {
      console.error(error);

      alert(
        "Não foi possível importar esse arquivo.\n\n" +
        error.message
      );
    }
  }
);


/* ============================================================
   EVENTOS GERAIS
   ============================================================ */

document
  .getElementById("newFolderBtn")
  .addEventListener(
    "click",
    abrirNovaPasta
  );

document
  .getElementById("newNpcBtn")
  .addEventListener(
    "click",
    abrirNovoNpc
  );

searchInput.addEventListener(
  "input",
  renderNpcCards
);

sortSelect.addEventListener(
  "change",
  renderNpcCards
);

document
  .querySelectorAll(
    "[data-close-dialog]"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .getElementById(
            button.dataset.closeDialog
          )
          .close();

      }
    );

  });


/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */

async function iniciar() {
  try {
    await abrirBanco();
    await recarregarDados();
  }
  catch (error) {
    console.error(error);

    alert(
      "Não foi possível abrir o banco local de NPCs.\n\n" +
      error.message
    );
  }
}

iniciar();
</script>
